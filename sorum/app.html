<title>술자리 소름테스트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 한 손 엄지로 조작하는 세로 카드 한 장. 어두운 술집 조명 아래서 읽히도록 다크 단일 테마. */
:root {
  --bg: #0f1f1c;        /* 소주병 유리색에 가까운 짙은 청록 */
  --surface: #172c28;
  --raised: #1f3933;
  --line: #2c4a43;
  --fg: #eef3ea;
  --muted: #9fb6ad;
  --accent: #f3b748;    /* 맥주 호박색 */
  --accent-ink: #2a1c02;
  --spicy: #ef7f8f;
  --font-display: "Do Hyeon", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
  -webkit-tap-highlight-color: transparent;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
#app { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.25; }
h1 { font-size: 2.6rem; letter-spacing: -0.01em; }
h1 em { font-style: normal; color: var(--accent); }
h2 { font-size: 1.75rem; }
h3 { font-size: 1.25rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.eyebrow { font-family: var(--font-display); font-size: 0.95rem; letter-spacing: 0.08em; color: var(--accent); }
.eyebrow.spicy { color: var(--spicy); }

.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.link { background: none; border: 0; color: var(--muted); font: inherit; font-size: 0.95rem; padding: 8px 0; cursor: pointer; }
.link:focus-visible, .btn:focus-visible, .opt:focus-visible, .mode:focus-visible, input:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.modes { display: grid; gap: 12px; }
.mode {
  text-align: left; cursor: pointer; font: inherit; color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 16px 18px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center;
}
.mode:active { transform: scale(0.99); }
.mode h3 { grid-column: 1; }
.mode p { grid-column: 1; color: var(--muted); font-size: 0.92rem; }
.mode .time { grid-column: 2; grid-row: 1 / span 2; font-family: var(--font-display); color: var(--accent); font-size: 1.05rem; white-space: nowrap; }

.settings { display: grid; gap: 14px; background: var(--surface); border-radius: 14px; padding: 16px 18px; }
.setrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--bg); border-radius: 999px; padding: 3px; gap: 2px; }
.chip { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 0.9rem; padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--raised); color: var(--fg); }
.chip.spicyon[aria-pressed="true"] { color: var(--spicy); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px 20px; display: flex; flex-direction: column; gap: 16px; }
.ask { font-size: 1.3rem; line-height: 1.55; font-family: var(--font-body); }
.opts { display: grid; gap: 10px; }
.opts.nine { grid-template-columns: repeat(3, 1fr); }
.opt {
  font: inherit; color: var(--fg); text-align: left; cursor: pointer;
  background: var(--raised); border: 1px solid transparent; border-radius: 12px; padding: 14px 16px; font-size: 1.05rem;
}
.opts.nine .opt { text-align: center; font-family: var(--font-display); font-size: 1.6rem; padding: 12px 0; }
.opt:active { border-color: var(--accent); }

label { display: block; font-size: 0.9rem; color: var(--muted); margin-bottom: 6px; }
input[type="text"] {
  width: 100%; font: inherit; font-size: 1.05rem; color: var(--fg);
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
}
input::placeholder { color: #6f8a80; }
.triple { display: grid; gap: 10px; }
.triple .row { display: grid; grid-template-columns: 1.1fr 1fr; gap: 8px; }
.triple .row span { grid-column: 1 / -1; font-family: var(--font-display); color: var(--accent); font-size: 0.95rem; }

.btn {
  font-family: var(--font-display); font-size: 1.25rem; cursor: pointer;
  border: 0; border-radius: 14px; padding: 15px 18px; width: 100%;
  background: var(--accent); color: var(--accent-ink);
}
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btns { display: grid; gap: 10px; }
.btns.two { grid-template-columns: 1fr 1fr; }

.lock { text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; padding-block: 12px; }
.lock .big { font-family: var(--font-display); font-size: 4rem; line-height: 1; color: var(--accent); }

.reveal-head { font-family: var(--font-display); font-size: 1.7rem; line-height: 1.35; color: var(--accent); text-wrap: balance; }
.quote { border-left: 3px solid var(--accent); padding: 4px 0 4px 14px; color: var(--muted); }
.quote b { color: var(--fg); font-weight: 400; }
.lines { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
.lines li { display: grid; gap: 2px; }
.lines li strong { font-family: var(--font-display); font-weight: 400; font-size: 1.1rem; }
.chill { background: var(--raised); border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px; }
.chill .tag { font-family: var(--font-display); color: var(--spicy); font-size: 0.95rem; letter-spacing: 0.05em; }
.penalty { font-size: 0.95rem; color: var(--muted); text-align: center; }
.penalty b { color: var(--fg); font-weight: 400; }

.progress { display: flex; gap: 6px; }
.progress i { flex: 1; height: 4px; border-radius: 4px; background: var(--line); }
.progress i.on { background: var(--accent); }

.pointer { font-family: var(--font-display); font-size: 2rem; line-height: 1.35; text-wrap: balance; }
.count { font-family: var(--font-display); font-size: 6rem; line-height: 1; color: var(--accent); text-align: center; }

details { background: var(--surface); border-radius: 14px; padding: 14px 18px; }
summary { cursor: pointer; font-family: var(--font-display); font-size: 1.1rem; }
details[open] summary { margin-bottom: 10px; }
details p + p { margin-top: 10px; }
.foot { font-size: 0.82rem; color: var(--muted); text-align: center; display: grid; gap: 6px; }
.foot b { color: var(--fg); font-weight: 400; }

@keyframes rise { from { opacity: 0.001; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.anim > * { animation: rise 0.45s ease both; }
.anim > *:nth-child(2) { animation-delay: 0.08s; }
.anim > *:nth-child(3) { animation-delay: 0.16s; }
.anim > *:nth-child(4) { animation-delay: 0.24s; }
.anim > *:nth-child(5) { animation-delay: 0.32s; }
@media (prefers-reduced-motion: reduce) { .anim > * { animation: none; } }
</style>

<main id="app" aria-live="polite"></main>

<script>
(function () {
"use strict";

/* ───────── 공용 도구 ───────── */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
// 받침 유무로 조사 고르기: 이름 뒤에 "은/는", "이/가"
const josa = (word, withBatchim, without) => {
  const w = String(word || "").trim(); if (!w) return without;
  const code = w.charCodeAt(w.length - 1) - 0xac00;
  if (code < 0 || code > 11171) return without;
  return code % 28 ? withBatchim : without;
};

const store = {
  get(k, d) { try { const v = localStorage.getItem("sorum:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("sorum:" + k, JSON.stringify(v)); } catch (e) {} }
};

const S = {
  screen: "home",
  spicy: store.get("spicy", false),
  penalty: store.get("penalty", "sip"),   // sip: 한 모금 / soft: 무알콜 벌칙
  guess: store.get("guess", true),        // 공개 전에 친구들이 먼저 맞히기
  name: "",
};

const softPenalties = ["물 한 컵 원샷", "옆 사람에게 칭찬 한 마디", "좋아하는 노래 한 소절", "10초 애교", "최근 사진첩 사진 하나 공개", "다음 판 진행자 맡기"];
const penaltyText = () => S.penalty === "sip" ? "한 모금" : pick(softPenalties);

/* ───────── 소름 한 줄 (바넘 문장) ─────────
   누구에게나 조금씩 맞는 말이지만, 자기 이야기처럼 느껴지는 문장들. */
const BARNUM = [
  "겉으로는 털털해 보여도, 사소한 말 한마디를 며칠씩 곱씹는 편이죠.",
  "모임에선 분위기를 살리는데, 집에 가는 길엔 갑자기 조용해져요.",
  "남의 부탁은 잘 들어주면서, 정작 내 부탁은 쉽게 못 꺼내요.",
  "아직 아무에게도 말하지 않은 계획이 하나 있어요.",
  "믿는 사람에겐 한없이 풀어지지만, 그 선 안으로 들이기까지 시간이 꽤 걸려요.",
  "가끔 '나 지금 잘 살고 있나' 싶은데, 티는 안 내요.",
  "혼자만의 시간이 꼭 필요한데, 너무 길어지면 또 외로워해요.",
  "결정은 빨리 하는 척하지만, 속으로는 몇 번이고 다시 생각해요.",
  "칭찬을 들으면 손사래 치지만, 그 말을 생각보다 오래 기억해요.",
  "예전에 놓친 기회 하나가 아직 마음 한구석에 남아 있어요.",
  "다들 당신이 강한 줄 알지만, 사실 기댈 곳을 찾고 있을 때가 있어요.",
  "남들이 모르는 예민한 포인트가 하나 있고, 거길 건드리면 오래 가요."
];
let barnumDeck = shuffle(BARNUM);
const nextBarnum = () => { if (!barnumDeck.length) barnumDeck = shuffle(BARNUM); return barnumDeck.pop(); };

/* ───────── 1분 테스트 카드 ─────────
   type: choice(선택지) / text(자유 입력) / triple(세 칸 입력) / nine(1~9 숫자)
   meaning: 공개 화면 맨 위에 나오는 '사실 이 질문은…' 문장 */
const QUICK = [
  {
    id: "animals", title: "세 마리 동물", type: "triple",
    ask: "좋아하는 동물 세 마리를 떠오르는 순서대로 쓰고, 각각 왜 좋은지 한 단어로 적어주세요.",
    reveal(a, n) {
      return {
        meaning: "세 동물은 각각 '보이고 싶은 나', '남이 보는 나', '진짜 나'예요.",
        head: `${n} 진짜 모습은 '${esc(a[2].w)}'`,
        lines: [
          [`첫째 ${esc(a[0].x)} · 보이고 싶은 나`, `사람들에게 '${esc(a[0].w)}' 사람으로 보이고 싶어 해요.`],
          [`둘째 ${esc(a[1].x)} · 남이 보는 나`, `주변에선 당신을 '${esc(a[1].w)}' 사람이라고 생각해요. 친구들, 맞으면 손!`],
          [`셋째 ${esc(a[2].x)} · 아무도 모르는 진짜 나`, `사실은 '${esc(a[2].w)}' 사람이에요. 마지막에 떠올린 것일수록 꾸미지 않은 마음이 나와요.`]
        ]
      };
    }
  },
  {
    id: "bottle", title: "유리병 편지", type: "text", placeholder: "편지 첫 문장",
    ask: "바닷가를 걷다 유리병을 주웠어요. 안에 편지가 들어 있어요. 첫 문장은 뭐라고 쓰여 있나요?",
    reveal(a, n) {
      return {
        meaning: "편지의 첫 문장은 지금 당신이 누군가에게 가장 듣고 싶은 말이에요.",
        head: `${n} 요즘 가장 듣고 싶은 말`,
        quote: a,
        body: "그 말을 해줬으면 하는 사람이 바로 떠올랐다면, 오늘 집에 가는 길에 먼저 연락해 보세요."
      };
    }
  },
  {
    id: "door", title: "문 앞의 사람", type: "text", placeholder: "떠오른 사람 (이름·관계 아무거나)",
    ask: "오래된 집에 혼자 있어요. 똑똑, 노크 소리. 문을 열어보니 누군가 서 있어요. 누구인가요?",
    reveal(a, n) {
      return {
        meaning: "문 앞에 선 사람은 당신 마음속에서 아직 정리가 안 끝난 사람이에요.",
        head: `${n} 마음에 남아 있는 사람`,
        quote: a,
        body: "고마움이든 미안함이든 그리움이든, 그 사람에게 아직 하지 못한 말이 있어요."
      };
    }
  },
  {
    id: "water", title: "숲속의 물", type: "choice",
    ask: "목이 마른 채로 숲을 걷다가 물을 발견했어요. 물이 얼마나 있나요?",
    meaning: "물의 양은 지금 사랑받고 싶은 마음, 연애 갈증의 크기예요.",
    opts: [
      ["물 한 컵", "갈증 낮음. 지금은 연애보다 내 생활이 우선이에요. 다가오는 사람이 있어도 천천히 봐요."],
      ["작은 옹달샘", "딱 적당한 갈증. 좋은 사람이 나타나면 마음 열 준비는 되어 있어요."],
      ["넓은 호수", "꽤 목말라요. 겉으로는 괜찮다고 하지만 설레는 일이 생기길 은근히 기다리고 있어요."],
      ["끝이 안 보이는 바다", "사랑에 진심인 사람. 한 번 빠지면 깊게 빠지고, 받은 만큼 이상을 주는 타입이에요."]
    ]
  },
  {
    id: "key", title: "주운 열쇠", type: "choice",
    ask: "길에서 열쇠를 하나 주웠어요. 어떤 열쇠인가요?",
    meaning: "열쇠는 지금 당신이 가장 손에 넣고 싶은 것을 뜻해요.",
    opts: [
      ["녹슨 옛날 쇠열쇠", "되돌리고 싶은 과거가 있어요. 다시 만나고 싶은 사람이나 다시 하고 싶은 일이요."],
      ["반짝이는 금열쇠", "돈과 성공. 요즘 통장이나 커리어를 보며 '이대로 괜찮나' 생각이 많았죠."],
      ["자동차 스마트키", "자유. 지금 있는 곳에서 잠깐 벗어나 아무 데로나 떠나고 싶어요."],
      ["일기장 자물쇠 열쇠", "털어놓고 싶은 비밀이 있어요. 들어줄 사람만 있으면 말하고 싶은 이야기요."]
    ]
  },
  {
    id: "wall", title: "눈앞의 벽", type: "choice",
    ask: "길을 걷는데 벽이 앞을 가로막았어요. 벽 높이는 어느 정도인가요?",
    meaning: "벽의 높이는 지금 당신이 느끼는 인생의 장애물 크기예요.",
    opts: [
      ["무릎 높이", "요즘 큰 고민은 없어요. 웬만한 일은 넘어가는 여유가 있는 시기예요."],
      ["내 키만큼", "해볼 만한 고민이 하나 있어요. 마음만 먹으면 넘을 수 있다는 것도 알고 있어요."],
      ["올려다봐야 할 만큼", "꽤 버거운 일이 있어요. 혼자 끙끙대지 말고 이 자리의 누군가에게 도와달라고 해도 돼요."],
      ["끝이 안 보이게 높음", "많이 지쳐 있어요. 오늘은 고민보다 쉬는 게 먼저예요. 옆 사람이 한 잔 따라주세요."]
    ]
  },
  {
    id: "elevator", title: "멈춘 엘리베이터", type: "choice",
    ask: "혼자 탄 엘리베이터가 갑자기 멈췄어요. 제일 먼저 하는 행동은?",
    meaning: "이건 가까운 사람과 싸웠을 때 당신이 어떻게 하는지를 보여줘요.",
    opts: [
      ["비상벨부터 누른다", "문제는 바로 꺼내서 해결하는 타입. 대신 상대는 가끔 숨 돌릴 시간이 필요해요."],
      ["휴대폰으로 누군가에게 연락", "싸우면 친구에게 먼저 털어놓아요. 그 친구는 아마 이 자리에 있을 거예요."],
      ["버튼을 전부 눌러본다", "일단 뭐라도 해야 마음이 놓여요. 그래서 싸운 날 먼저 연락하는 쪽은 주로 당신이죠."],
      ["가만히 기다린다", "말없이 시간을 갖는 타입. 상대는 그 침묵이 제일 무서워요."]
    ]
  },
  {
    id: "battery", title: "배터리 잔량", type: "choice",
    ask: "지금 바로 휴대폰 배터리를 확인하세요. 몇 %인가요? (거짓말 금지, 다들 확인!)",
    meaning: "배터리 관리 습관은 인생 관리 스타일과 꽤 닮아 있어요.",
    opts: [

  const seg = (key, val, label, extra) => `<button class="chip ${extra || ""}" data-set="${key}" data-val="${val}" aria-pressed="${String(S[key]) === String(val)}">${label}</button>`;
  return `
  <header style="display:grid;gap:10px;padding-top:8px">
    <span class="eyebrow">휴대폰 한 대로 돌려가며 하는</span>
    <h1>술자리<br><em>소름</em>테스트</h1>
    <p class="muted">질문 하나, 답 하나, 그리고 "어? 이거 나잖아." 한 판에 1분이면 충분해요.</p>
  </header>

  <div>
    <label for="who">지금 차례인 사람 이름 (선택)</label>
    <input type="text" id="who" placeholder="예) 상훈" value="${esc(S.name)}" maxlength="10" autocomplete="off">
  </div>

  <div class="modes">
    <button class="mode" data-act="quick"><h3>1분 소름 카드</h3><p>질문 하나로 속마음을 읽어요. 친구들은 먼저 답을 맞혀요.</p><span class="time">1분</span></button>
    <button class="mode" data-act="cube"><h3>사막의 큐브</h3><p>눈 감고 상상 여행. 7가지 장면으로 나, 친구, 연인, 걱정을 읽어요.</p><span class="time">3분</span></button>
    <button class="mode" data-act="point"><h3>하나 둘 셋 지목</h3><p>질문을 읽고 셋 세면 동시에 손가락으로 지목! 다 같이 하는 판.</p><span class="time">전원</span></button>
  </div>

  <section class="settings" aria-label="게임 설정">
    <div class="setrow"><span>수위</span><span class="seg">${seg("spicy", false, "순한맛")}${seg("spicy", true, "매운맛", "spicyon")}</span></div>
    <div class="setrow"><span>벌칙</span><span class="seg">${seg("penalty", "sip", "한 모금")}${seg("penalty", "soft", "무알콜 벌칙")}</span></div>
    <div class="setrow"><span>공개 전 친구들 예측</span><span class="seg">${seg("guess", true, "켜기")}${seg("guess", false, "끄기")}</span></div>
  </section>

  <details>
    <summary>진행자만 보세요: 왜 소름 돋을까?</summary>
    <p>1949년 심리학자 버트럼 포러가 학생들에게 성격검사를 하고 "개인별 결과"를 나눠줬어요. 사실 모두 같은 문장이었는데, 학생들은 정확도를 5점 만점에 평균 4.3점으로 매겼어요. 이걸 <b>바넘 효과(포러 효과)</b>라고 해요.</p>
    <p>이 앱의 소름 포인트는 세 가지예요. ① 본인이 직접 쓴 단어를 결과에 그대로 돌려줘요. ② 누구에게나 조금씩 맞는 "소름 한 줄"을 붙여요. ③ 친구들 앞에서 공개해서, 친구들의 "맞네!" 반응이 확신을 키워요.</p>
    <p>그러니 결과는 재미로만! 누군가 진지하게 상처받는 것 같으면 바로 다음 판으로 넘겨주세요.</p>
  </details>

  <footer class="foot">
    <p>입력한 내용은 이 휴대폰 화면에만 있고 어디에도 저장·전송되지 않아요.</p>
    <p>재미용 심리테스트예요. 실제 심리상담·진단이 아니에요.</p>
    <p>마음이 많이 힘들 땐 <b>자살예방상담전화 109</b> · <b>정신건강위기상담 1577-0199</b> (24시간)</p>
  </footer>`;
}

/* 1분 카드 */
function viewQAsk() {
  const q = flow.q, n = S.name;
  let input = "";
  if (q.type === "choice") input = `<div class="opts">${q.opts.map((o, i) => `<button class="opt" data-act="qPick" data-i="${i}">${esc(o[0])}</button>`).join("")}</div>`;
  if (q.type === "nine") input = `<div class="opts nine">${q.opts.map((o, i) => `<button class="opt" data-act="qPick" data-i="${i}">${o[0]}</button>`).join("")}</div>`;
  if (q.type === "text") input = `<div><label for="qtext">떠오른 그대로 적으세요</label><input type="text" id="qtext" maxlength="40" placeholder="${esc(q.placeholder)}" autocomplete="off"></div>
    <button class="btn" data-act="qText">답 잠그기</button>`;
  if (q.type === "triple") input = `<div class="triple">${[0, 1, 2].map(i => `<div class="row"><span>${i + 1}번째</span>
      <input type="text" id="tx${i}" maxlength="10" placeholder="동물" aria-label="${i + 1}번째 동물" autocomplete="off">
      <input type="text" id="tw${i}" maxlength="10" placeholder="한 단어 (예: 귀여운)" aria-label="${i + 1}번째 이유" autocomplete="off"></div>`).join("")}</div>
    <button class="btn" data-act="qTriple">답 잠그기</button>`;
  return `${top()}
  <div class="card">
    <span class="eyebrow ${q.spicy ? "spicy" : ""}">${esc(q.title)}${n ? " · " + esc(n) + " 차례" : ""}</span>
    <p class="ask">${esc(q.ask)}</p>
    ${input}
  </div>
  <p class="small muted" style="text-align:center">답하는 사람만 화면을 보세요. 생각은 짧게, 첫 느낌으로.</p>`;
}

function viewQLock() {
  return `${top()}
  <div class="card lock">
    <span class="big">잠금</span>
    <h2>${who(S.name)}의 답이 잠겼어요</h2>
    <p class="muted">화면을 모두에게 보여주세요.<br>${who(S.name)}이 뭐라고 답했을지 한 명씩 예측해서 말해보세요.</p>
    <p class="penalty">공개했을 때 예측이 크게 빗나간 사람은 <b>${esc(penaltyText())}</b></p>
  </div>
  <button class="btn" data-act="qShow">공개하기</button>`;
}

function viewQReveal() {
  const q = flow.q, a = flow.answer, n = S.name;
  let head, body = "", quote = "", lines = "";
  const meaning = q.reveal ? null : q.meaning;
  if (q.reveal) {
    const r = q.reveal(a, n ? esc(n) + "님의" : "당신의");
    head = r.head;
    quote = r.quote != null ? `<p class="quote">"<b>${esc(r.quote)}</b>"</p>` : "";
    body = r.body ? `<p>${r.body}</p>` : "";
    lines = r.lines ? `<ul class="lines">${r.lines.map(l => `<li><strong>${l[0]}</strong><span class="muted">${l[1]}</span></li>`).join("")}</ul>` : "";
    flow.meaning = r.meaning;
  } else {
    const o = q.opts[a];
    head = `${who(n)}의 선택: ${esc(o[0])}`;
    body = `<p>${esc(o[1])}</p>`;
    flow.meaning = meaning;
  }
  return `${top()}
  <div class="card">
    <span class="eyebrow">사실 이 질문은</span>
    <p class="muted">${esc(flow.meaning)}</p>
    <p class="reveal-head">${head}</p>
    ${quote}${lines}${body}
    <div class="chill"><span class="tag">소름 한 줄</span><p>${esc(nextBarnum())}</p></div>
  </div>
  <div class="btns two">
    <button class="btn ghost" data-act="qSame">다음 사람, 같은 질문</button>
    <button class="btn" data-act="quick">새 질문</button>
  </div>
  <div><label for="who">다음 차례 이름 (선택)</label><input type="text" id="who" value="" maxlength="10" placeholder="이름" autocomplete="off"></div>`;
}

/* 사막의 큐브 */
function viewCube() {
  const i = flow.i, c = CUBE[i];
  return `${top()}
  <div class="progress" aria-label="${i + 1} / ${CUBE.length}">${CUBE.map((_, k) => `<i class="${k <= i ? "on" : ""}"></i>`).join("")}</div>
  <div class="card">
    <span class="eyebrow">사막의 큐브 · ${i + 1}/${CUBE.length}${S.name ? " · " + esc(S.name) : ""}</span>
    <p class="muted">${esc(c.scene)}</p>
    <p class="ask">${esc(c.q)}</p>
    <div class="opts">${c.opts.map((o, k) => `<button class="opt" data-act="cubePick" data-i="${k}">${esc(o)}</button>`).join("")}</div>
  </div>
  <p class="small muted" style="text-align:center">진행자가 장면을 천천히 읽어주면 몰입감이 두 배예요.</p>`;
}
function viewCubeLock() {
  return `${top()}
  <div class="card lock">
    <span class="big">완성</span>
    <h2>${who(S.name)}의 사막이 완성됐어요</h2>
    <p class="muted">공개 전에 친구들이 맞혀보세요.<br>${who(S.name)}의 큐브는 컸을까, 작았을까? 말은 묶여 있었을까?</p>
    <p class="penalty">셋 중 둘 이상 틀린 사람은 <b>${esc(penaltyText())}</b></p>
  </div>
  <button class="btn" data-act="cubeShow">해석 보기</button>`;
}
function viewCubeReveal() {
  const p = flow.picks;
  const keys = CUBE.map(c => c.key);
  // 큐브(나)와 말(연인) 조합으로 한 줄 총평
  const big = p[0] >= 2, horseNear = p[4] === 0 || p[4] === 3;
  const sum = big && horseNear ? "자존감도 단단하고 연애도 직진. 마음먹은 건 손에 넣는 사람이에요."
    : big ? "혼자서도 잘 서 있는 사람. 그래서 가끔 외로움을 남보다 늦게 알아채요."
    : horseNear ? "사랑받을 때 가장 빛나는 사람. 좋은 사람 옆에서 크게 자라요."
    : "조용히 자기 속도로 가는 사람. 가까워질수록 매력이 보이는 타입이에요.";
  return `${top()}
  <div class="card">
    <span class="eyebrow">사막의 큐브 해석</span>
    <p class="reveal-head">${esc(sum)}</p>
    <ul class="lines">${keys.map((k, i) => `<li><strong>${CUBE_READ[k].title}</strong><span class="muted">"${esc(CUBE[i].opts[p[i]])}"</span><span>${esc(CUBE_READ[k].r[p[i]])}</span></li>`).join("")}</ul>
    <div class="chill"><span class="tag">소름 한 줄</span><p>${esc(nextBarnum())}</p></div>
  </div>
  <div class="btns two">
    <button class="btn ghost" data-act="home">처음으로</button>
    <button class="btn" data-act="cube">다음 사람</button>
  </div>`;
}

/* 지목 게임 */
function viewPoint() {
  return `${top()}
  <div class="card">
    <span class="eyebrow ${S.spicy ? "spicy" : ""}">하나 둘 셋 지목</span>
    <p class="pointer">${esc(flow.text)}</p>
    <p class="muted">질문을 소리 내어 읽고, 아래 버튼을 누르면 카운트다운이 시작돼요. 0이 되면 모두 동시에 지목!</p>
  </div>
  <button class="btn" data-act="pointGo">카운트다운 시작</button>
  <button class="btn ghost" data-act="point">다른 질문</button>`;
}
function viewPointCount() {
  return `${top()}<div class="card lock"><span class="count" id="cnt">3</span><p class="muted">${esc(flow.text)}</p></div>`;
}
function viewPointResult() {
  return `${top()}
  <div class="card">
    <span class="eyebrow">지목!</span>
    <p class="pointer">가장 많이 지목된 사람은 <span style="color:var(--accent)">${esc(penaltyText())}</span></p>
    <div class="chill"><span class="tag">심리 한 스푼</span><p>${esc(pick(POINT_TWIST))}</p></div>
  </div>
  <button class="btn" data-act="point">다음 질문</button>`;
}

/* ───────── 동작 ───────── */
function readName() { const el = document.getElementById("who"); if (el) S.name = el.value.trim(); }

const actions = {
  home() { readName(); S.screen = "home"; },
  quick() { readName(); flow = { q: nextQuick() }; S.screen = "qAsk"; },
  qSame() { readName(); S.screen = "qAsk"; },
  qPick(el) { flow.answer = +el.dataset.i; S.screen = S.guess ? "qLock" : "qReveal"; },
  qText() {
    const v = document.getElementById("qtext").value.trim();
    if (!v) return document.getElementById("qtext").focus(), false;
    flow.answer = v; S.screen = S.guess ? "qLock" : "qReveal";
  },
  qTriple() {
    const a = [0, 1, 2].map(i => ({ x: document.getElementById("tx" + i).value.trim(), w: document.getElementById("tw" + i).value.trim() }));
    const miss = a.findIndex(r => !r.x || !r.w);
    if (miss >= 0) { document.getElementById((a[miss].x ? "tw" : "tx") + miss).focus(); return false; }
    flow.answer = a; S.screen = S.guess ? "qLock" : "qReveal";
  },
  qShow() { S.screen = "qReveal"; },
  cube() { readName(); flow = { i: 0, picks: [] }; S.screen = "cube"; },
  cubePick(el) {
    flow.picks.push(+el.dataset.i); flow.i++;
    S.screen = flow.i < CUBE.length ? "cube" : (S.guess ? "cubeLock" : "cubeReveal");
  },
  cubeShow() { S.screen = "cubeReveal"; },
  point() { flow = { text: nextPoint() }; S.screen = "point"; },
  pointGo() {
    S.screen = "pointCount"; render();
    let n = 3;
    const tick = () => {
      n--;
      if (S.screen !== "pointCount") return;
      if (n > 0) { const c = document.getElementById("cnt"); if (c) c.textContent = n; setTimeout(tick, 800); }
      else { S.screen = "pointResult"; render(); try { navigator.vibrate && navigator.vibrate(120); } catch (e) {} }
    };
    setTimeout(tick, 800);
    return false;
  }
};

// 뒤로가기 버튼(안드로이드 앱·브라우저): 게임 중이면 첫 화면으로 돌아가요
function enterGame() { try { if (!(history.state && history.state.game)) history.pushState({ game: 1 }, ""); } catch (e) {} }
window.addEventListener("popstate", () => { if (S.screen !== "home") { readName(); S.screen = "home"; render(); } });

app.addEventListener("click", e => {
  const set = e.target.closest("[data-set]");
  if (set) {
    readName();
    const k = set.dataset.set, raw = set.dataset.val;
    S[k] = raw === "true" ? true : raw === "false" ? false : raw;
    store.set(k, S[k]);
    if (k === "spicy") { quickDeck = []; pointDeck = []; }
    render(); return;
  }
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const fn = actions[btn.dataset.act];
  const act = btn.dataset.act;
  if (act === "home" && history.state && history.state.game) { try { history.back(); return; } catch (err) {} }
  if (S.screen === "home" && act !== "home") enterGame();
  if (fn && fn(btn) !== false) render();
});
app.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.target.tagName !== "INPUT") return;
  const b = app.querySelector('.btn[data-act="qText"], .btn[data-act="qTriple"]');
  if (b && e.target.id !== "who") { e.preventDefault(); b.click(); }
});

render();
})();
</script>
